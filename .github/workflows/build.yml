name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          allow-prereleases: true
      - run: pip install --upgrade pip
      - run: pip install pillow
      - run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      - name: Run setup.sh (stop on first error)
        run: |
          sed -i '' 's/^mkdir /mkdir -p /' setup.sh
          sed -i '' 's#tar -xzvf Python-3.10-iOS-support.b1.tar.gz#tar -xzvf ../Python-3.10-iOS-support.b1.tar.gz#' setup.sh
          bash -e ./setup.sh
      - name: Download ssh_cmd (missing from setup.sh)
        run: |
          cd Extensions/Dependencies/ios_system
          curl -fL -O https://github.com/holzschu/ios_system/releases/download/v3.0.0/ssh_cmd.xcframework.zip \
            || curl -fL -O https://github.com/holzschu/ios_system/releases/download/v3.0.2/ssh_cmd.xcframework.zip
          unzip -q ssh_cmd.xcframework.zip
          rm ssh_cmd.xcframework.zip
      - name: Verify setup output
        run: |
          missing=0
          for f in \
            python3_ios/Python3_ios/libPython3.10.a \
            python3_ios/Python3_ios/libOpenSSL.a \
            python3_ios/Python3_ios/libFFI.a \
            opencv2.framework \
            Extensions/OpenBlas/openblas.framework \
            Extensions/SciPy/scipy-deps.framework \
            Extensions/Dependencies/ios_system/awk.xcframework \
            Extensions/Dependencies/ios_system/shell.xcframework \
            Extensions/Dependencies/ios_system/ssh_cmd.xcframework \
            Extensions/Dependencies/libssh2/libssh2.a
          do
            if [ ! -e "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          exit $missing
      - name: Build
        run: |
          xcodebuild -workspace Pyto.xcworkspace -scheme Pyto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/Pyto.app Payload/
          zip -r Pyto.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pyto-ipa
          path: Pyto.ipa
